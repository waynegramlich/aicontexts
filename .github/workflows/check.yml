# Check `aicontexts` as a new user gets it, on Linux, Windows and macOS,
# for every supported Python, with `release_check.py`.
#
# `target` says where it comes from: `source` (a wheel built from the
# chosen commit, the default), or `testpypi` or `pypi`, which need a
# `version`.  `source` also runs the linters.  Started by hand, from the
# Actions tab or with
#     gh workflow run check.yml -f target=source
# and by `release.yml` after every upload, with the version it built.
# Uploads nothing, so it needs no environment and no approval.  See
# `R.gwr` (GitHub Workflow Rules).

name: check
run-name: check ${{ inputs.target }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where aicontexts comes from
        required: true
        default: source
        type: choice
        options:
          - source
          - testpypi
          - pypi
      version:
        description: The version (for testpypi and pypi only)
        required: false
        type: string
  # The same inputs, from `release.yml`, which has no choice type.
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      version:
        required: false
        type: string

# Only reading the repository.
permissions:
  contents: read

jobs:
  # The linters, at the versions used locally, so that a new upstream
  # rule can not fail a run.
  lint:
    if: inputs.target == 'source'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install
          ruff==0.17.2 flake8==7.4.1 mypy==2.4.0 pylint==4.1.3
      - run: ruff check ai_contexts.py ai_contexts_test.py release_check.py
      - run: >-
          ruff format --check --line-length 79
          ai_contexts.py ai_contexts_test.py release_check.py
      - run: flake8 ai_contexts.py ai_contexts_test.py release_check.py
      - run: >-
          mypy --strict ai_contexts.py ai_contexts_test.py release_check.py
      - run: pylint ai_contexts.py ai_contexts_test.py release_check.py

  # The installed package's own tests and a session with `aic`, as a new
  # user on each system.
  stranger:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest     # Apple Silicon.
          - macos-15-intel   # The last Intel image, until fall 2027.
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # The inputs pass through the environment, never into the script.
      # `TMPDIR` puts the scratch directory where a failure can keep it.
      - run: python release_check.py "$TARGET" ${VERSION:+"$VERSION"}
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
          TMPDIR: ${{ runner.temp }}
      # `release_check.py` keeps its scratch directory when it fails.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scratch-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/release_check-*
          include-hidden-files: true
